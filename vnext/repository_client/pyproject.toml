[project]
name = "gateway-repository-client"
version = "0.1.0"
description = "Gateway vNext Repository Service client SDK"
authors = [
    { name = "issac", email = "issac@test.com" }
]
requires-python = ">=3.14.6"
dependencies = [
    "gateway-repository-contracts==0.1.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
gateway-repository-contracts = { path = "../repository_contracts", editable = true }

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--strict-markers"]
markers = [
    "unit: no heavyweight external dependency; safe at full parallelism",
    "integration: needs real dolt, subprocesses, or durable on-disk state",
    "serial: timing sensitive; must not compete for CPU with other tests",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["gateway_repository_contracts", "gateway_repository_contracts.*"]
ignore_missing_imports = true
