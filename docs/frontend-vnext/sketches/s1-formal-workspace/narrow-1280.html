<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F5F7; color: #1B2229; font-family: 'IBM Plex Sans', 'PingFang SC', 'Noto Sans SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; font-size: 13px; overflow: hidden">

  <header style="height: 52px; flex: 0 0 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #FFFFFF; border-bottom: 1px solid #DDE2E7">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="font-size: 15px; font-weight: 600">网关数据工作台</span>
      <span style="width: 1px; height: 18px; background: #DDE2E7"></span>
      <span style="color: #4A5563">[网关名称]</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: #F1F3F5; color: #4A5563; font-size: 12px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
        提交执行中
      </span>
      <span style="width: 1px; height: 18px; background: #DDE2E7"></span>
      <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #1E7A46; font-weight: 500">
        <span style="width: 8px; height: 8px; border-radius: 4px; background: #1E7A46"></span>
        已连接
      </span>
    </div>
  </header>

  <div style="flex: 1 1 auto; min-height: 0; display: flex; gap: 16px; padding: 16px">

    <section aria-label="组态树" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #DDE2E7; border-radius: 8px; overflow: hidden">

      <div style="height: 56px; flex: 0 0 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid #EEF1F4">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">组态树</h2>
        <label style="margin-left: 12px; display: flex; align-items: center; gap: 8px; width: 260px; height: 34px; padding: 0 10px; box-sizing: border-box; border: 1px solid #C9D0D8; border-radius: 6px; color: #5F6B78">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          <input type="search" placeholder="搜索节点" aria-label="搜索节点" style="border: 0; outline: none; flex: 1; font: inherit; color: #1B2229; background: transparent">
        </label>
        <span style="flex: 1"></span>
        <label style="display: flex; align-items: center; gap: 6px; color: #4A5563">
          <input type="checkbox" style="width: 16px; height: 16px; margin: 0">
          仅显示当前基线
        </label>
        <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #C9D0D8; border-radius: 6px; background: #FFFFFF; color: #1B2229; font: inherit">展开全部</button>

        <span style="font-weight: 600">工作区 [用户A]</span>
        <span style="color: #5F6B78">基线 3</span>
        <span style="flex: 1"></span>
        <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #C9D0D8; border-radius: 6px; background: #FFFFFF; color: #1B2229; font: inherit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg>
          原始组态备份

        <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #C9D0D8; border-radius: 6px; background: #FFFFFF; color: #1B2229; font: inherit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg>

      <div aria-hidden="true" style="height: 36px; flex: 0 0 36px; display: grid; grid-template-columns: minmax(0, 1fr) 140px 140px 140px; align-items: center; padding: 0 16px; border-bottom: 1px solid #EEF1F4; color: #5F6B78; font-size: 12px; font-weight: 500">

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B2229" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"></path><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"></path><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"></path></svg>

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F5FBF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg>
            <span style="font-weight: 600">工作区 [用户A]</span>
            <span style="display: inline-flex; align-items: center; gap: 6px; margin-left: 4px; color: #4A5563; font-size: 12px"><span style="width: 6px; height: 6px; border-radius: 3px; background: #1F5FBF"></span>编辑中</span>
          </span>
          <span style="color: #5F6B78">—</span>
          <span style="color: #5F6B78">—</span>
          <span style="color: #5F6B78">—</span>
        </button>

        <button type="button" role="treeitem" aria-level="3" style="width: 100%; height: 40px; display: grid; grid-template-columns: minmax(0, 1fr) 140px 140px 140px; align-items: center; padding: 0 16px; border: 0; border-bottom: 1px solid #EEF1F4; background: #FFFFFF; color: #1B2229; font: inherit; text-align: left">
          <span style="display: flex; align-items: center; gap: 8px; min-width: 0; padding-left: 56px">

          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4A5563">09-28 15:02</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4A5563">09-29 10:31</span>

          <span style="display: flex; align-items: center; gap: 8px; min-width: 0; padding-left: 56px">
            <span style="width: 16px"></span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6B78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><line x1="3" x2="9" y1="12" y2="12"></line><line x1="15" x2="21" y1="12" y2="12"></line></svg>

          </span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4A5563">09-26 11:47</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4A5563">09-26 13:10</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4A5563">09-27 09:05</span>
        </button>

        <button type="button" role="treeitem" aria-level="2" aria-expanded="true" style="width: 100%; height: 40px; display: grid; grid-template-columns: minmax(0, 1fr) 140px 140px 140px; align-items: center; padding: 0 16px; border: 0; border-bottom: 1px solid #EEF1F4; background: #FFFFFF; color: #1B2229; font: inherit; text-align: left">
          <span style="display: flex; align-items: center; gap: 8px; min-width: 0; padding-left: 28px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6B78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>

          </span>
          <span style="color: #5F6B78">—</span>
          <span style="color: #5F6B78">—</span>
          <span style="color: #5F6B78">—</span>
        </button>

        <button type="button" role="treeitem" aria-level="3" style="width: 100%; height: 40px; display: grid; grid-template-columns: minmax(0, 1fr) 140px 140px 140px; align-items: center; padding: 0 16px; border: 0; border-bottom: 1px solid #EEF1F4; background: #FFFFFF; color: #1B2229; font: inherit; text-align: left">
          <span style="display: flex; align-items: center; gap: 8px; min-width: 0; padding-left: 56px">

            <span style="display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; color: #1F5FBF; font-size: 12px">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
              提交执行中
            </span>
          </span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4A5563">09-30 08:55</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4A5563">09-30 09:20</span>
          <span style="color: #5F6B78">—</span>
        </button>

        <button type="button" role="treeitem" aria-level="1" aria-expanded="false" style="width: 100%; height: 40px; display: grid; grid-template-columns: minmax(0, 1fr) 140px 140px 140px; align-items: center; padding: 0 16px; border: 0; border-bottom: 1px solid #EEF1F4; background: #FFFFFF; color: #1B2229; font: inherit; text-align: left">

            <span style="font-weight: 600">基线 1</span>
            <span style="display: inline-flex; align-items: center; gap: 6px; margin-left: 4px; color: #4A5563; font-size: 12px"><span style="width: 6px; height: 6px; border-radius: 3px; background: #5F6B78"></span>已归档</span>

      </div>

      <div aria-label="比较托盘" style="height: 52px; flex: 0 0 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-top: 1px solid #DDE2E7; background: #F7F9FB">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="18" r="3"></circle><circle cx="6" cy="6" r="3"></circle><path d="M13 6h3a2 2 0 0 1 2 2v7"></path><path d="M11 18H8a2 2 0 0 1-2-2V9"></path></svg>
        <span style="font-weight: 600">比较托盘</span>
        <span style="color: #5F6B78">未选择节点</span>
        <span style="flex: 1"></span>
        <button type="button" disabled style="height: 34px; padding: 0 12px; border: 1px solid #E1E5EA; border-radius: 6px; background: #F1F3F5; color: #6B7682; font: inherit">清空比较</button>
        <button type="button" disabled style="height: 34px; padding: 0 14px; border: 1px solid #E1E5EA; border-radius: 6px; background: #F1F3F5; color: #6B7682; font: inherit; font-weight: 500">历史比较</button>
      </div>
    </section>

    <aside aria-label="节点详情（已折叠）" style="width: 48px; flex: 0 0 48px; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 0; box-sizing: border-box; background: #FFFFFF; border: 1px solid #DDE2E7; border-radius: 8px">
      <button type="button" aria-label="展开详情面板" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 1px solid #DDE2E7; border-radius: 6px; background: #FFFFFF; color: #4A5563">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M15 3v18"></path><path d="m10 15-3-3 3-3"></path></svg>
      </button>
      <span style="writing-mode: vertical-rl; color: #4A5563; font-size: 12px; letter-spacing: 2px">工作区详情</span>
    </aside>
  </div>
</div>
</body>
