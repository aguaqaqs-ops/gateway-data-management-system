[project]
name = "gateway-conformance"
version = "0.1.0"
description = "Gateway vNext Conformance Harness schema and fixture validation"
readme = "README.md"
authors = [
    { name = "issac", email = "issac@test.com" }
]
requires-python = ">=3.14.6"
dependencies = [
    "gateway-shared-kernel==0.1.0",
    "jsonschema==4.26.0",
    "pyarrow==25.0.0",
    "ruamel.yaml==0.19.1",
]

[project.optional-dependencies]
conformance = []
writer = ["gateway-compute-python==0.1.0"]
matrix = [
    "gateway-compute-python==0.1.0",
    "gateway-backend==0.1.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
gateway-shared-kernel = { path = "../shared_kernel", editable = true }
gateway-compute-python = { path = "../rust/gateway-compute-python" }
gateway-backend = { path = "../backend" }

[dependency-groups]
dev = [
    "gateway-shared-kernel[conformance]",
    "jsonschema==4.26.0",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.15.21",
]

[tool.pytest.ini_options]
testpaths = ["tests", "phase2/tests"]
pythonpath = ["src", "tests", "phase2"]
markers = [
    "pr_native: WP5 R4 rust-native matrix cell on release wheel (GATE_PR_NATIVE=1)",
    "phase_exit_container: PHASE-EXIT-CONTAINER gate-owned static/identity/smoke regression tests",
    "nested_cli: subprocess gate CLI tests excluded from nested static pytest runs",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "phase2"]

[[tool.mypy.overrides]]
module = ["support", "tests.support", "gate_ownership", "tests.gate_ownership"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gateway_conformance", "gateway_conformance.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["router", "gate"]
disable_error_code = ["misc"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "referencing", "referencing.*", "ruamel", "ruamel.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gateway_backend", "gateway_backend.*", "gateway_compute", "gateway_compute.*"]
ignore_missing_imports = true
