[project]
name = "gateway-repository-service"
version = "0.1.0"
description = "Gateway vNext Repository Service bootstrap"
readme = "README.md"
authors = [
    { name = "issac", email = "issac@test.com" }
]
requires-python = ">=3.14.6"
dependencies = [
    "fastapi==0.139.0",
    "gateway-repository-contracts==0.1.0",
    "pyarrow==25.0.0",
    "pydantic-settings==2.14.2",
    "uvicorn==0.51.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
gateway-repository-contracts = { path = "../repository_contracts", editable = true }

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.0",
    "mysql-connector-python==9.7.0",
    "pytest==9.1.1",
    "ruff==0.15.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
files = ["src/gateway_repository_service", "tests"]
