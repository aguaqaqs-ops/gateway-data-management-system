[package]
name = "gateway-compute-python"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "gateway_compute"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module", "gateway-compute-python-impl/extension-module"]

[dependencies]
gateway-compute-python-impl = { path = "../gateway-compute-python-impl" }
pyo3 = { workspace = true, features = ["auto-initialize"] }

[dev-dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
gateway-compute-core = { path = "../gateway-compute-core" }
pyo3 = { workspace = true, features = ["auto-initialize"] }
pyo3-arrow.workspace = true
