[project]
name = "gateway-backend"
version = "0.1.0"
description = "Gateway vNext backend walking skeleton"
readme = "README.md"
authors = [
    { name = "issac", email = "issac@test.com" }
]
requires-python = ">=3.14.6"
dependencies = [
    "fastapi==0.139.0",
    "gateway-compute-python==0.1.0",
    "gateway-repository-client==0.1.0",
    "gateway-repository-contracts==0.1.0",
    "gateway-shared-kernel==0.1.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pyarrow==25.0.0",
    "uvicorn==0.51.0",
    "python-multipart==0.0.20",
]

[tool.uv.sources]
gateway-compute-python = { path = "../rust/gateway-compute-python" }
gateway-repository-client = { path = "../repository_client", editable = true }
gateway-repository-contracts = { path = "../repository_contracts", editable = true }
gateway-shared-kernel = { path = "../shared_kernel", editable = true }

[project.scripts]
gateway-backend = "gateway_backend:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "blake3==1.0.10",
    "httpx==0.28.1",
    "hypothesis==6.156.6",
    "maturin==1.14.1",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.15.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "unit: no heavyweight external dependency; safe at full parallelism",
    "integration: needs real dolt, subprocesses, or durable on-disk state",
    "serial: timing sensitive; must not compete for CPU with other tests",
    "parallel_safe: serial test audited as safe for the parallel batch",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
"benchmarks/real_dump_census.py" = ["E402"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "gateway_compute",
    "gateway_compute.exceptions",
    "pyarrow",
    "pyarrow.ipc",
    "gateway_repository_client",
    "gateway_repository_client.*",
]
ignore_missing_imports = true
