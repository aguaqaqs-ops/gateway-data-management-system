# Included in the host nginx http context for CT110 only. Secrets and generated
# TLS keys are installed separately outside the source tree.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;
    ssl_certificate /home/dev/gdds-gw-dms-08-v2/a/tls/cert.pem;
    ssl_certificate_key /home/dev/gdds-gw-dms-08-v2/a/tls/key.pem;
    root /var/lib/gdds08-web/frontend/dist;
    access_log off;
    client_max_body_size 0;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    location = /manual { return 308 /manual/; }
    location /manual/ {
        alias /var/lib/gdds08-web/a-public/;
        index index.html;
        add_header Cache-Control no-store always;
        add_header Referrer-Policy no-referrer always;
    }
    location = /manual-api/status {
        proxy_pass http://127.0.0.1:18991/status;
        proxy_set_header Authorization "";
    }
    location = /manual-api/reset {
        proxy_pass http://127.0.0.1:18991/reset;
        proxy_set_header Authorization "";
        proxy_set_header Host $http_host;
    }
    location = /api/handoffs {
        proxy_pass http://127.0.0.1:18102/a;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
    }
    location /api/ {
        proxy_pass http://127.0.0.1:18100;
        proxy_set_header Authorization "";
    }
    location /v1/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location / {
        sub_filter_once on;
        sub_filter '<div id="root"></div>' '<div style="padding:4px 12px;background:#31578d;color:white;font:14px sans-serif">环境 A · 单设备测试</div><div id="root"></div>';
        try_files $uri /index.html;
    }
}

server {
    listen 9443 ssl;
    listen [::]:9443 ssl;
    server_name _;
    ssl_certificate /home/dev/gdds-gw-dms-08-v2/b/tls/cert.pem;
    ssl_certificate_key /home/dev/gdds-gw-dms-08-v2/b/tls/key.pem;
    access_log off;
    add_header Referrer-Policy no-referrer always;
    location = / {
        proxy_pass http://127.0.0.1:18101;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header ETag;
        add_header Cache-Control no-store always;
        add_header Referrer-Policy no-referrer always;
        sub_filter_once on;
        sub_filter '<div id="root"></div>' '<div style="padding:4px 12px;background:#31578d;color:white;font:14px sans-serif">环境 B · 多设备目录测试</div><div id="root"></div>';
    }
    location = /api/handoffs {
        proxy_pass http://127.0.0.1:18102/b;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
    }
    location / {
        proxy_pass http://127.0.0.1:18101;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
    }
}

