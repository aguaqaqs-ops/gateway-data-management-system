services:
  backend:
    image: ${PHASE_EXIT_IMAGE_TAG:?PHASE_EXIT_IMAGE_TAG required}
    ports:
      - "${GATEWAY_BACKEND_HOST_PORT:-18000}:8000"
    environment:
      GATEWAY_BACKEND_ARTIFACT_ROOT: /var/lib/gateway/artifacts
      GATEWAY_SOURCE_REVISION: ${SOURCE_REVISION:?SOURCE_REVISION required}
      GATEWAY_EXPECTED_WHEEL_SHA256: ${WHEEL_SHA256:?WHEEL_SHA256 required}
      GATEWAY_EXPECTED_EXTENSION_SHA256: ${EXTENSION_SHA256:?EXTENSION_SHA256 required}
    volumes:
      - backend-artifacts:/var/lib/gateway/artifacts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

volumes:
  backend-artifacts:
