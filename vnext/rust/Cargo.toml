[workspace]
members = [
    "gateway-architecture-check",
    "gateway-compute-core",
    "gateway-compute-python",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
pyo3 = "=0.29.0"
pyo3-arrow = "=0.19.0"
thiserror = "=2.0.18"

[workspace.lints.rust]
unsafe_code = "forbid"
unstable_features = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
