services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      network: ${GATEWAY_DOCKER_BUILD_NETWORK:-}
      args:
        UV_BOOTSTRAP_INDEX_URL: ${GATEWAY_BACKEND_UV_BOOTSTRAP_INDEX_URL:-https://pypi.org/simple}
        UV_BOOTSTRAP_TRUSTED_HOST: ${GATEWAY_BACKEND_UV_BOOTSTRAP_TRUSTED_HOST:-}
    ports:
      - "8000:8000"
    environment:
      GATEWAY_BACKEND_CONTROL_DB_PATH: /var/lib/gateway/control/control.sqlite3
      GATEWAY_BACKEND_ARTIFACT_ROOT: /var/lib/gateway/artifacts
      GATEWAY_BACKEND_REPOSITORY_BASE_URL: ${GATEWAY_BACKEND_REPOSITORY_BASE_URL:-http://repository-service:8000}
      GATEWAY_BACKEND_REPOSITORY_BEARER_TOKEN_FILE: /run/secrets/repository-bearer-token
      GATEWAY_BACKEND_INTERNAL_BEARER_TOKEN_FILE: /run/secrets/backend-internal-bearer
      GATEWAY_BACKEND_REPOSITORY_TIMEOUT_SECONDS: "30.0"
      GATEWAY_BACKEND_SESSION_FILE: /run/secrets/backend-session
      GATEWAY_BACKEND_PROVISIONED_MAPPING_FILE: /run/gateway/provisioned-mapping.json
    volumes:
      - backend-artifacts:/var/lib/gateway/artifacts
      - backend-control:/var/lib/gateway/control
      - ${GATEWAY_BACKEND_PROVISIONED_MAPPING_FILE:-./config/provisioned-mapping.json}:/run/gateway/provisioned-mapping.json:ro
    secrets:
      - repository-bearer-token
      - backend-session
      - backend-internal-bearer
    depends_on:
      repository-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 180s
  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      network: ${GATEWAY_DOCKER_BUILD_NETWORK:-}
      args:
        UV_BOOTSTRAP_INDEX_URL: ${GATEWAY_BACKEND_UV_BOOTSTRAP_INDEX_URL:-https://pypi.org/simple}
        UV_BOOTSTRAP_TRUSTED_HOST: ${GATEWAY_BACKEND_UV_BOOTSTRAP_TRUSTED_HOST:-}
    restart: unless-stopped
    command: ["python", "-m", "gateway_backend.bootstrap.operation_worker"]
    environment:
      GATEWAY_BACKEND_OPERATION_WORKER_CONTROL_DB_PATH: /var/lib/gateway/control/control.sqlite3
      GATEWAY_BACKEND_OPERATION_WORKER_ARTIFACT_ROOT: /var/lib/gateway/artifacts
      GATEWAY_BACKEND_OPERATION_WORKER_REPOSITORY_BASE_URL: ${GATEWAY_BACKEND_REPOSITORY_BASE_URL:-http://repository-service:8000}
      GATEWAY_BACKEND_OPERATION_WORKER_REPOSITORY_BEARER_TOKEN_FILE: /run/secrets/repository-bearer-token
      GATEWAY_BACKEND_OPERATION_WORKER_REPOSITORY_TIMEOUT_SECONDS: "30.0"
      GATEWAY_BACKEND_OPERATION_WORKER_PROVISIONED_MAPPING_FILE: /run/gateway/provisioned-mapping.json
    volumes:
      - backend-artifacts:/var/lib/gateway/artifacts
      - backend-control:/var/lib/gateway/control
      - ${GATEWAY_BACKEND_PROVISIONED_MAPPING_FILE:-./config/provisioned-mapping.json}:/run/gateway/provisioned-mapping.json:ro
    secrets:
      - repository-bearer-token
    stop_grace_period: 180s
    depends_on:
      backend:
        condition: service_healthy
      repository-service:
        condition: service_healthy
  repository-probe:
    profiles: ["p2-r1"]
    cgroup: host
    cgroup_parent: ${GATEWAY_P2R1_CGROUP_PARENT:-gateway-p2r1-unconfigured.slice}
    image: ${GATEWAY_P2R1_IMAGE:-gateway-p2r1-repository:dev}
    entrypoint: []
    build:
      context: ..
      dockerfile: repository_service/Dockerfile
      network: ${GATEWAY_DOCKER_BUILD_NETWORK:-}
      args:
        CANDIDATE_SHA: ${GATEWAY_P2R1_CANDIDATE_SHA:-unknown}
        BUILD_INPUT_REVISION: ${GATEWAY_P2R1_BUILD_INPUT_REVISION:-unknown}
        SOURCE_TREE_SHA256: ${GATEWAY_P2R1_SOURCE_TREE_SHA256:-unknown}
    command: ["python", "-m", "gateway_repository_service.target_gate"]
    environment:
      GATEWAY_REPOSITORY_DATA_ROOT: /var/lib/gateway/repository
      GATEWAY_REPOSITORY_CGROUP_ROOT: /sys/fs/cgroup/gateway-p2r1
      GATEWAY_REPOSITORY_CGROUP_LAYOUT: /run/gateway-p2r1/cgroup-layout.json
      GATEWAY_REPOSITORY_CGROUP_CONTROL_GROUP: ${GATEWAY_P2R1_CGROUP_CONTROL_GROUP:-}
      GATEWAY_REPOSITORY_CGROUP_PARENT: ${GATEWAY_P2R1_CGROUP_PARENT:-gateway-p2r1-unconfigured.slice}
      GATEWAY_P2R1_IMAGE_DIGEST: ${GATEWAY_P2R1_IMAGE_DIGEST:-}
      GATEWAY_P2R1_CANDIDATE_SHA: ${GATEWAY_P2R1_CANDIDATE_SHA:-}
      GATEWAY_P2R1_BUILD_INPUT_REVISION: ${GATEWAY_P2R1_BUILD_INPUT_REVISION:-}
      GATEWAY_P2R1_BUILD_REVISION: ${GATEWAY_P2R1_BUILD_REVISION:-}
      GATEWAY_P2R1_CACHE_CONDITION: ${GATEWAY_P2R1_CACHE_CONDITION:-}
      GATEWAY_P2R1_LOCK_SHA256: ${GATEWAY_P2R1_LOCK_SHA256:-}
      GATEWAY_P2R1_SOURCE_TREE_SHA256: ${GATEWAY_P2R1_SOURCE_TREE_SHA256:-}
      GATEWAY_P2R1_PROVENANCE_VERIFIED: ${GATEWAY_P2R1_PROVENANCE_VERIFIED:-0}
      GATEWAY_P2R1_PROVENANCE_MANIFEST: /run/gateway-p2r1/provenance.json
      GATEWAY_P2R1_STORAGE_LAYOUT: /run/gateway-p2r1/storage-layout.json
      GATEWAY_P2R1_TARGET_CONTAINER: "1"
      GATEWAY_P2R1_PROJECT_NAME: ${GATEWAY_P2R1_PROJECT_NAME:-gateway-p2r1-unconfigured}
    volumes:
      - repository-data:/var/lib/gateway/repository
      - type: bind
        source: ${GATEWAY_P2R1_CGROUP_ROOT:-/sys/fs/cgroup/gateway-p2r1-unconfigured}
        target: /sys/fs/cgroup/gateway-p2r1
        read_only: false
      - type: bind
        source: ${GATEWAY_P2R1_RUN_DIR:-/run/gateway-p2r1-unconfigured}
        target: /run/gateway-p2r1
        read_only: true
  repository-service:
    image: ${GATEWAY_REPOSITORY_SERVICE_IMAGE:-gateway-repository-service:local}
    init: true
    build:
      context: ..
      dockerfile: repository_service/Dockerfile
      network: ${GATEWAY_DOCKER_BUILD_NETWORK:-}
      args:
        BASE_IMAGE: ${GATEWAY_REPOSITORY_BASE_IMAGE:-python:3.14.6-slim-bookworm}
        USE_PRELOADED_DEPENDENCIES: ${GATEWAY_REPOSITORY_USE_PRELOADED_DEPENDENCIES:-0}
        DOLT_DOWNLOAD_URL: ${GATEWAY_REPOSITORY_DOLT_DOWNLOAD_URL:-}
        UV_BOOTSTRAP_INDEX_URL: ${GATEWAY_REPOSITORY_UV_BOOTSTRAP_INDEX_URL:-https://pypi.org/simple}
        UV_BOOTSTRAP_TRUSTED_HOST: ${GATEWAY_REPOSITORY_UV_BOOTSTRAP_TRUSTED_HOST:-}
        CANDIDATE_SHA: ${GATEWAY_P2R1_CANDIDATE_SHA:-unknown}
        BUILD_INPUT_REVISION: ${GATEWAY_P2R1_BUILD_INPUT_REVISION:-unknown}
        SOURCE_TREE_SHA256: ${GATEWAY_P2R1_SOURCE_TREE_SHA256:-unknown}
    environment:
      GATEWAY_REPOSITORY_PROFILE: production
      GATEWAY_REPOSITORY_DATA_ROOT: /var/lib/gateway/repository
      GATEWAY_REPOSITORY_DOLT_BINARY: /usr/local/bin/dolt
      GATEWAY_REPOSITORY_BEARER_TOKEN_FILE: /run/secrets/repository-bearer-token
      GATEWAY_REPOSITORY_ARTIFACT_TTL_SECONDS: ${GATEWAY_REPOSITORY_ARTIFACT_TTL_SECONDS:-86400}
      GATEWAY_REPOSITORY_ARTIFACT_CLEANUP_INTERVAL_SECONDS: ${GATEWAY_REPOSITORY_ARTIFACT_CLEANUP_INTERVAL_SECONDS:-300}
      GATEWAY_REPOSITORY_MAX_CONCURRENT_UPLOADS: ${GATEWAY_REPOSITORY_MAX_CONCURRENT_UPLOADS:-8}
      GATEWAY_REPOSITORY_MAX_IMPORT_WORKERS: ${GATEWAY_REPOSITORY_MAX_IMPORT_WORKERS:-4}
      GATEWAY_REPOSITORY_MAX_QUEUED_IMPORTS: ${GATEWAY_REPOSITORY_MAX_QUEUED_IMPORTS:-64}
      GATEWAY_REPOSITORY_MAX_CONCURRENT_ROW_STREAMS: ${GATEWAY_REPOSITORY_MAX_CONCURRENT_ROW_STREAMS:-8}
      GATEWAY_REPOSITORY_FULL_SCAN_TIMEOUT_SECONDS: ${GATEWAY_REPOSITORY_FULL_SCAN_TIMEOUT_SECONDS:-3600}
      GATEWAY_REPOSITORY_MIN_FREE_DISK_BYTES: ${GATEWAY_REPOSITORY_MIN_FREE_DISK_BYTES:-5368709120}
      GATEWAY_REPOSITORY_MIN_FREE_DISK_FRACTION: ${GATEWAY_REPOSITORY_MIN_FREE_DISK_FRACTION:-0.10}
      GATEWAY_REPOSITORY_IMPORT_HEADROOM_BYTES: ${GATEWAY_REPOSITORY_IMPORT_HEADROOM_BYTES:-1073741824}
    secrets:
      - repository-bearer-token
    volumes:
      - repository-service-data:/var/lib/gateway/repository
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
secrets:
  repository-bearer-token:
    file: ${GATEWAY_P2R2_BEARER_TOKEN_FILE}
  backend-session:
    file: ${GATEWAY_BACKEND_SESSION_FILE}
  backend-internal-bearer:
    file: ${GATEWAY_BACKEND_INTERNAL_BEARER_TOKEN_FILE}
volumes:
  backend-artifacts:
  backend-control:
  repository-data:
  repository-service-data:
