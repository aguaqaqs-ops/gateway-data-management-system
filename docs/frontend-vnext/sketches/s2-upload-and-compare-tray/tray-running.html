<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S2 上传步骤卡与比较托盘 · 托盘 · 执行中</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F5F7}
a{color:#1F5FBF}a:hover{color:#174A96}
</style>
</head>
<body>
<!-- 设计草图快照，导出自“前端优化草图”画布；仅作视觉与交互参考，不是实现代码。数据为示例。见 docs/frontend-vnext/ui-optimization-direction.md 第 7 节。 -->
<div style="width: 1464px; height: 100px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #DDE2E7; border-radius: 0 0 8px 8px; overflow: hidden; color: #1B2229; font-family: 'IBM Plex Sans', 'PingFang SC', 'Noto Sans SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; font-size: 13px">
  <div aria-hidden="true" style="height: 38px; flex: 0 0 38px; display: flex; align-items: center; padding: 0 16px 0 40px; color: #9AA3AD">基线 1 · 已归档</div>
  <div aria-label="比较托盘" aria-busy="true" style="flex: 1 1 auto; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-top: 1px solid #DDE2E7; background: #F7F9FB">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="18" r="3"></circle><circle cx="6" cy="6" r="3"></circle><path d="M13 6h3a2 2 0 0 1 2 2v7"></path><path d="M11 18H8a2 2 0 0 1-2-2V9"></path></svg>
    <span style="font-weight: 600">比较托盘</span>
    <ol style="margin: 0; padding: 0; list-style: none; display: flex; align-items: center; gap: 8px">
      <li style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; background: #F1F3F5; border: 1px solid #DDE2E7; color: #4A5563">
        <span style="color: #1F5FBF; font-weight: 600">1</span>
        历史初始备份 1
      </li>
      <li aria-hidden="true" style="color: #9AA3AD">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
      </li>
      <li style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; background: #F1F3F5; border: 1px solid #DDE2E7; color: #4A5563">
        <span style="color: #1F5FBF; font-weight: 600">2</span>
        提交 2
      </li>
      <li aria-hidden="true" style="color: #9AA3AD">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
      </li>
      <li style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; background: #F1F3F5; border: 1px solid #DDE2E7; color: #4A5563">
        <span style="color: #1F5FBF; font-weight: 600">3</span>
        提交 3
      </li>
    </ol>
    <span style="width: 1px; height: 24px; background: #DDE2E7; margin: 0 4px"></span>
    <ol aria-label="比较进度" style="margin: 0; padding: 0; list-style: none; display: flex; align-items: center; gap: 6px; font-size: 12px">
      <li style="display: inline-flex; align-items: center; gap: 4px; color: #1E7A46">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
        创建
      </li>
      <li aria-hidden="true" style="width: 20px; height: 2px; background: #BFE0CC"></li>
      <li aria-current="step" style="display: inline-flex; align-items: center; gap: 4px; color: #1F5FBF; font-weight: 600">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
        补齐中
      </li>
      <li aria-hidden="true" style="width: 20px; height: 2px; background: #DDE2E7"></li>
      <li style="color: #5F6B78">计算</li>
      <li aria-hidden="true" style="width: 20px; height: 2px; background: #DDE2E7"></li>
      <li style="color: #5F6B78">完成</li>
    </ol>
    <span style="color: #4A5563; font-size: 12px">历史节点信息正在准备。</span>
    <span style="flex: 1"></span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5F6B78">已用时 1 分 12 秒</span>
    <button type="button" disabled style="height: 34px; padding: 0 12px; border: 1px solid #E1E5EA; border-radius: 6px; background: #F1F3F5; color: #6B7682; font: inherit">清空比较</button>
    <button type="button" disabled style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 1px solid #E1E5EA; border-radius: 6px; background: #F1F3F5; color: #6B7682; font: inherit; font-weight: 500">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
      比较中
    </button>
  </div>
</div>
