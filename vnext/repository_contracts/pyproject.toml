[project]
name = "gateway-repository-contracts"
version = "0.1.0"
description = "Gateway vNext Repository Service public contracts"
authors = [
    { name = "issac", email = "issac@test.com" }
]
requires-python = ">=3.14.6"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis==6.156.6",
    "jsonschema==4.26.0",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.21",
    "rfc8785==0.1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "rfc8785", "rfc8785.*"]
ignore_missing_imports = true
