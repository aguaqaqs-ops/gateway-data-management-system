<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S2 上传步骤卡与比较托盘 · 托盘 · 执行失败（可重试）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F5F7}
a{color:#1F5FBF}a:hover{color:#174A96}
</style>
</head>
<body>
<!-- 设计草图快照，导出自“前端优化草图”画布；仅作视觉与交互参考，不是实现代码。数据为示例。见 docs/frontend-vnext/ui-optimization-direction.md 第 7 节。 -->
<div style="width: 1464px; height: 140px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #DDE2E7; border-radius: 0 0 8px 8px; overflow: hidden; color: #1B2229; font-family: 'IBM Plex Sans', 'PingFang SC', 'Noto Sans SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; font-size: 13px">
  <div aria-hidden="true" style="height: 38px; flex: 0 0 38px; display: flex; align-items: center; padding: 0 16px 0 40px; color: #9AA3AD">基线 1 · 已归档</div>
  <div aria-label="比较托盘" style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 8px; padding: 10px 16px; border-top: 1px solid #DDE2E7; background: #F7F9FB">
    <div style="display: flex; align-items: center; gap: 12px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="18" r="3"></circle><circle cx="6" cy="6" r="3"></circle><path d="M13 6h3a2 2 0 0 1 2 2v7"></path><path d="M11 18H8a2 2 0 0 1-2-2V9"></path></svg>
      <span style="font-weight: 600">比较托盘</span>
      <span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 4px; background: #FDECEA; color: #B42318; font-size: 12px; font-weight: 500">可重试失败</span>
      <ol style="margin: 0; padding: 0; list-style: none; display: flex; align-items: center; gap: 8px">
        <li style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 10px; border-radius: 6px; background: #FFFFFF; border: 1px solid #C9D0D8">
          <span style="color: #1F5FBF; font-weight: 600">1</span>
          历史初始备份 1
          <span style="font-size: 12px; color: #1E7A46">就绪</span>
          <button type="button" aria-label="移出比较：历史初始备份 1" style="width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 4px; background: transparent; color: #4A5563">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
          </button>
        </li>
        <li aria-hidden="true" style="color: #9AA3AD">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
        </li>
        <li style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 10px; border-radius: 6px; background: #FFFFFF; border: 1px solid #E3B76F">
          <span style="color: #1F5FBF; font-weight: 600">2</span>
          提交 2
          <span style="font-size: 12px; color: #8F5600">需重建</span>
          <button type="button" aria-label="移出比较：提交 2" style="width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 4px; background: transparent; color: #4A5563">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
          </button>
        </li>
        <li aria-hidden="true" style="color: #9AA3AD">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
        </li>
        <li style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 10px; border-radius: 6px; background: #FFFFFF; border: 1px solid #C9D0D8">
          <span style="color: #1F5FBF; font-weight: 600">3</span>
          提交 3
          <span style="font-size: 12px; color: #1E7A46">就绪</span>
          <button type="button" aria-label="移出比较：提交 3" style="width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 4px; background: transparent; color: #4A5563">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
          </button>
        </li>
      </ol>
      <span style="flex: 1"></span>
      <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #C9D0D8; border-radius: 6px; background: #FFFFFF; color: #1B2229; font: inherit">清空比较</button>
      <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 1px solid #1F5FBF; border-radius: 6px; background: #1F5FBF; color: #FFFFFF; font: inherit; font-weight: 500">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        重试
      </button>
    </div>
    <div role="alert" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 6px; background: #FDECEA; color: #8A1C12; font-size: 12px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
      <span>比较未完成：[后端返回的失败原因]。已保留所选节点，可直接重试或调整后再比较。</span>
      <span style="flex: 1"></span>
      <button type="button" style="padding: 0; border: 0; background: transparent; color: #8A1C12; font: inherit; font-size: 12px; text-decoration: underline">查看诊断信息</button>
    </div>
  </div>
</div>
</body>
</html>
