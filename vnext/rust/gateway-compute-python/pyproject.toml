[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "gateway-compute-python"
version = "0.1.0"
requires-python = ">=3.14.6"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "gateway_compute._native"
python-source = "python"
features = ["extension-module"]

[tool.maturin.sbom]
# CycloneDX SBOM embeds a random serialNumber and build timestamp, which changes
# the installed backend .venv digest on every build and prevents carry-over.
rust = false
auditwheel = false
