[project]
name = "gateway-backend"
version = "0.1.0"
description = "Gateway vNext backend walking skeleton (container runtime)"
readme = "README.md"
authors = [
    { name = "issac", email = "issac@test.com" }
]
requires-python = ">=3.14.6"
dependencies = [
    "fastapi==0.139.0",
    "gateway-shared-kernel==0.1.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pyarrow==25.0.0",
    "uvicorn==0.51.0",
]

[tool.uv.sources]
gateway-shared-kernel = { path = "../shared_kernel", editable = true }

[project.scripts]
gateway-backend = "gateway_backend:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
