<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S2 上传步骤卡与比较托盘 · 上传 · 校验失败</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F5F7}
a{color:#1F5FBF}a:hover{color:#174A96}
</style>
</head>
<body>
<!-- 设计草图快照，导出自“前端优化草图”画布；仅作视觉与交互参考，不是实现代码。数据为示例。见 docs/frontend-vnext/ui-optimization-direction.md 第 7 节。 -->
<aside aria-label="工作区详情" style="width: 400px; height: 760px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #DDE2E7; border-radius: 8px; overflow: hidden; color: #1B2229; font-family: 'IBM Plex Sans', 'PingFang SC', 'Noto Sans SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; font-size: 13px">

  <div style="display: flex; align-items: flex-start; justify-content: space-between; padding: 16px 16px 14px; border-bottom: 1px solid #EEF1F4">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; color: #5F6B78; font-weight: 500">工作区信息</span>
      <span style="display: flex; align-items: center; gap: 10px">
        <span style="font-size: 18px; font-weight: 600">工作区 [用户A]</span>
        <span style="display: inline-flex; align-items: center; gap: 6px; color: #4A5563; font-size: 12px"><span style="width: 6px; height: 6px; border-radius: 3px; background: #1F5FBF"></span>编辑中</span>
      </span>
      <span style="color: #5F6B78">基线 3</span>
    </div>
    <button type="button" aria-label="折叠详情面板" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 1px solid #DDE2E7; border-radius: 6px; background: #FFFFFF; color: #4A5563">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M15 3v18"></path><path d="m8 9 3 3-3 3"></path></svg>
    </button>
  </div>

  <dl style="margin: 0; padding: 4px 16px; display: grid; grid-template-columns: 96px minmax(0, 1fr); border-bottom: 1px solid #EEF1F4">
    <dt style="padding: 10px 0; color: #5F6B78">网关</dt>
    <dd style="margin: 0; padding: 10px 0">[网关名称]</dd>
    <dt style="padding: 10px 0; color: #5F6B78">主线</dt>
    <dd style="margin: 0; padding: 10px 0">已加载</dd>
  </dl>

  <section aria-label="上传组态" style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h3 style="margin: 0; font-size: 14px; font-weight: 600">上传组态</h3>
      <button type="button" style="padding: 0; border: 0; background: transparent; color: #1F5FBF; font: inherit; font-size: 12px">目录要求</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid #DDE2E7; border-radius: 8px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 24px; height: 24px; flex: 0 0 24px; border-radius: 12px; background: #E7F4EC; color: #1E7A46; display: inline-flex; align-items: center; justify-content: center">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
        </span>
        <span style="font-weight: 600">原始组态备份</span>
        <span style="height: 20px; padding: 0 6px; border-radius: 4px; background: #F1F3F5; color: #4A5563; font-size: 12px; line-height: 20px">可选</span>
        <span style="flex: 1"></span>
        <button type="button" style="height: 30px; padding: 0 10px; border: 1px solid #C9D0D8; border-radius: 6px; background: #FFFFFF; color: #1B2229; font: inherit">重新选择</button>
        <button type="button" aria-label="移除原始组态备份" style="width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 1px solid #C9D0D8; border-radius: 6px; background: #FFFFFF; color: #4A5563">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        </button>
      </div>
      <div style="margin-left: 34px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500">station_cfg_0921/</span>
        <span style="color: #5F6B78; font-size: 12px">1,276 个文件 · 85.9 MB · 主文件 station.pmc</span>
        <span style="color: #1E7A46; font-size: 12px">校验通过</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid #E8B4AE; border-radius: 8px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 24px; height: 24px; flex: 0 0 24px; border-radius: 12px; background: #FDECEA; color: #B42318; display: inline-flex; align-items: center; justify-content: center">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>
        </span>
        <span style="font-weight: 600">本次归档组态</span>
        <span style="height: 20px; padding: 0 6px; border-radius: 4px; background: #E9F0FB; color: #1F5FBF; font-size: 12px; line-height: 20px; font-weight: 500">必选</span>
        <span style="flex: 1"></span>
        <button type="button" style="height: 30px; padding: 0 10px; border: 1px solid #C9D0D8; border-radius: 6px; background: #FFFFFF; color: #1B2229; font: inherit">重新选择</button>
      </div>
      <div style="margin-left: 34px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500">station_cfg_0928/</span>
        <span style="color: #5F6B78; font-size: 12px">1,298 个文件 · 87.0 MB</span>
      </div>
      <div role="alert" style="margin-left: 34px; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 6px; background: #FDECEA; color: #8A1C12">
        <span style="font-size: 12px; font-weight: 600">未通过校验（2 项）</span>
        <ul style="margin: 0; padding-left: 16px; font-size: 12px; line-height: 20px">
          <li>根目录下必须恰好存在一个 <code style="font-family: 'IBM Plex Mono', monospace">.pmc</code> 文件</li>
          <li>目录中必须存在 <code style="font-family: 'IBM Plex Mono', monospace">sql/dbcfg.sql</code></li>
        </ul>
        <button type="button" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: transparent; color: #8A1C12; font: inherit; font-size: 12px; text-decoration: underline">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
          复制错误信息
        </button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px solid #DDE2E7; border-radius: 8px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 24px; height: 24px; flex: 0 0 24px; border-radius: 12px; background: #F1F3F5; color: #4A5563; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">3</span>
        <span style="font-weight: 600">上传</span>
        <span style="flex: 1"></span>
        <span style="color: #5F6B78; font-size: 12px">上传方式：—</span>
      </div>
      <button type="button" disabled aria-describedby="upload-invalid-reason" style="height: 36px; border: 1px solid #E1E5EA; border-radius: 6px; background: #F1F3F5; color: #6B7682; font: inherit; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" x2="12" y1="3" y2="15"></line></svg>
        上传
      </button>
      <span id="upload-invalid-reason" style="color: #5F6B78; font-size: 12px; text-align: center">本次归档组态未通过校验</span>
    </div>
  </section>
</aside>
</body>
</html>
