<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>单设备联调环境</title><link rel="stylesheet" href="/manual/style.css"></head>
<body><main>
  <p class="label">人工联调 · 环境 A</p>
  <h1>单设备流程测试</h1>
  <p>进入设备提交树后，可上传、预览、提交、审核及归档。审核通过与归档推进基线是不同的操作。</p>
  <p>本环境使用测试身份 <strong>test1</strong>，可执行提交和审核操作。同一设备的测试人员共享工作区，请避免同时编辑。</p>
  <button id="enter" type="button">进入单设备提交树</button>
  <section aria-labelledby="reset-heading">
    <h2 id="reset-heading">重新开始</h2>
    <p>重置只影响环境 A：清除其上传、工作区、提交和审批数据，重新开通设备并恢复 INITIAL。环境 B 不受影响。</p>
    <button id="reset" type="button">一键重置单设备测试环境</button>
    <p id="status" role="status" aria-live="polite">正在读取状态…</p>
    <p>重置后，请关闭其他已打开的环境 A 页面，再从这里重新进入；失败时查看运维手册并可受控重试。</p>
  </section>
</main><script type="module" src="/manual/app.js"></script></body></html>
