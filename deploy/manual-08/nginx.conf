# Included in the host nginx http context for CT110 only. Secrets and generated
# TLS keys are installed separately outside the source tree.
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /home/dev/gdds-gw-dms-08-v2/a/tls/cert.pem;
    ssl_certificate_key /home/dev/gdds-gw-dms-08-v2/a/tls/key.pem;
    root /home/dev/gdds-gw-dms-08-v2/frontend/dist;
    access_log off;
    client_max_body_size 0;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    location = /manual { return 308 /manual/; }
    location /manual/ {
        auth_basic "单设备联调环境";
        auth_basic_user_file /home/dev/gdds-gw-dms-08-v2/a/credentials/htpasswd;
        alias /home/dev/gdds-gw-dms-08-v2/source/deploy/manual-08/public/;
        index index.html;
        add_header Cache-Control no-store always;
    }
    location = /manual-api/status {
        auth_basic "单设备联调环境";
        auth_basic_user_file /home/dev/gdds-gw-dms-08-v2/a/credentials/htpasswd;
        proxy_pass http://127.0.0.1:18991/status;
        proxy_set_header Authorization "";
    }
    location = /manual-api/reset {
        auth_basic "单设备联调环境";
        auth_basic_user_file /home/dev/gdds-gw-dms-08-v2/a/credentials/htpasswd;
        proxy_pass http://127.0.0.1:18991/reset;
        proxy_set_header Authorization "";
    }
    location /api/ {
        auth_basic "单设备联调环境";
        auth_basic_user_file /home/dev/gdds-gw-dms-08-v2/a/credentials/htpasswd;
        proxy_pass http://127.0.0.1:18100;
        proxy_set_header Authorization "";
    }
    location /v1/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location / { try_files $uri /index.html; }
}

server {
    listen 9443 ssl;
    server_name _;
