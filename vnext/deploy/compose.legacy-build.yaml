services:
  backend-legacy-build:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        PYTHON_RUNTIME_IMAGE: ${PYTHON_RUNTIME_IMAGE:?PYTHON_RUNTIME_IMAGE required}
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
        WHEEL_SHA256: ${WHEEL_SHA256:?WHEEL_SHA256 required}
        EXTENSION_SHA256: ${EXTENSION_SHA256:?EXTENSION_SHA256 required}
        UV_WHEEL_SHA256: ${UV_WHEEL_SHA256:?UV_WHEEL_SHA256 required}
        UV_VERSION: ${UV_VERSION:-0.11.28}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14.6}
    ports:
      - "${GATEWAY_BACKEND_HOST_PORT:-18000}:8000"
    environment:
      GATEWAY_BACKEND_ARTIFACT_ROOT: /var/lib/gateway/artifacts
      GATEWAY_SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
      GATEWAY_EXPECTED_WHEEL_SHA256: ${WHEEL_SHA256:-unknown}
      GATEWAY_EXPECTED_EXTENSION_SHA256: ${EXTENSION_SHA256:-unknown}
    volumes:
      - backend-artifacts:/var/lib/gateway/artifacts
  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        PYTHON_RUNTIME_IMAGE: ${PYTHON_RUNTIME_IMAGE:?PYTHON_RUNTIME_IMAGE required}
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
        WHEEL_SHA256: ${WHEEL_SHA256:?WHEEL_SHA256 required}
        EXTENSION_SHA256: ${EXTENSION_SHA256:?EXTENSION_SHA256 required}
        UV_WHEEL_SHA256: ${UV_WHEEL_SHA256:?UV_WHEEL_SHA256 required}
        UV_VERSION: ${UV_VERSION:-0.11.28}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14.6}
    command: ["python", "-c", "print('worker bootstrap')"]
  repository-service:
    build:
      context: ..
      dockerfile: repository_service/Dockerfile
    environment:
      GATEWAY_REPOSITORY_DATA_ROOT: /var/lib/gateway/repository
    volumes:
      - repository-dolt:/var/lib/gateway/repository/dolt
      - repository-registry:/var/lib/gateway/repository/registry
      - repository-operation-journal:/var/lib/gateway/repository/operation-journal

volumes:
  backend-artifacts:
  repository-dolt:
  repository-registry:
  repository-operation-journal:
