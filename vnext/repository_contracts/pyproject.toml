[project]
name = "gateway-repository-contracts"
version = "0.1.0"
description = "Gateway vNext Repository Service public contracts"
authors = [
    { name = "issac", email = "issac@test.com" }
]
requires-python = ">=3.14.6"
dependencies = [
    "pydantic==2.13.4",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.15.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "unit: no heavyweight external dependency; safe at full parallelism",
    "integration: needs real dolt, subprocesses, or durable on-disk state",
    "serial: timing sensitive; must not compete for CPU with other tests",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
